services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379/0
      # Local-only placeholder; set a real secret (e.g. `bin/rails secret`) in any deployed environment.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-docker-only-not-a-real-secret}
      RAILS_FORCE_SSL: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Cache-only Redis: bounded memory, evict least-recently-used keys when full, no persistence.
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
